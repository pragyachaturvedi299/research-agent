llm:
  model: "gpt-4.1-mini" #default (other options to try[gpt-4.1,gpt-4o-mini,gpt-4.1-pro,o1-mini])
  temperature: 0.2

pipeline:
  enable_planning: true
  enable_search: true
  enable_summarization: true
  enable_evaluation: true

planning:
  num_subquestions: 5

search:
  provider: "openai"     # openai / tavily / none
  max_results: 5

evaluation:
  enable_vector_metrics: true
  enable_readability: true
  enable_coherence: true
  enable_completeness: true

output:
  save_report: true
  save_evaluation: true
